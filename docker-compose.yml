version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: harithon
      POSTGRES_PASSWORD: harithonpass
      POSTGRES_DB: harithon
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=${MONGO_URI}
      - PG_URI=${PG_URI}
      - MQTT_BROKER=${MQTT_BROKER}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
      - postgres
      - mosquitto

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - api

volumes:
  mongo_data:
  pg_data:
